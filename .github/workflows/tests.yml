name: Regression tests (manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci || npm install
      - run: npm run build
      - run: pip install -r test/requirements.txt && python -m playwright install --with-deps chromium
      - run: bash test/runall.sh | tee test-output.txt
      - run: python3 test/reach_check.py
      - run: python3 test/devices.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test/**/*.png
